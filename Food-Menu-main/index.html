    /* ─── CART PAGE ─── */
    function CartPage({ cart, setCart, user, onBack, onCheckout }) {
      const subtotal = cart.reduce((s, p) => s + (p.salePrice || p.price), 0);
      // Group unique products and sum delivery charges
      const seenProducts = {};
      cart.forEach(p => { const k = p.id || p.name; if (!seenProducts[k]) seenProducts[k] = p; });
      const totalDelivery = Object.values(seenProducts).reduce((s, p) => s + (p.deliveryCharge || 0), 0);
      const total = subtotal + totalDelivery;
      const removeItem = (idx) => setCart(prev => prev.filter((_, i) => i !== idx));
      // group same products
      const grouped = [];
      const seen = {};
      cart.forEach((p, i) => {
        const k = p.id || p.name;
        if (seen[k] !== undefined) { grouped[seen[k]].qty++; grouped[seen[k]].indices.push(i); }
        else { seen[k] = grouped.length; grouped.push({ ...p, qty: 1, indices: [i] }); }
      });
      return (
        <div className="cart-page">
          <div className="cart-container">
            <div className="cart-page-header">
              <button className="cart-back-btn" onClick={onBack}>‹</button>
              <h2>🛒 My Cart ({cart.length})</h2>
            </div>
            {grouped.length === 0 ? (
              <div className="cart-empty">
                <div className="cart-empty-icon">🛒</div>
                <p>Your cart is empty</p>
                <button className="cart-checkout-btn" style={{ marginTop: 16, width: 'auto', padding: '12px 32px' }} onClick={onBack}>Browse Menu</button>
              </div>
            ) : (
              <>
                <div className="cart-items-list">
                  {grouped.map((p, gi) => (
                    <div className="cart-item-card" key={gi}>
                      <img className="cart-item-img" src={p.imgs ? p.imgs[0] : (p.image || 'https://images.unsplash.com/photo-1633945274405-b6c8069047b0?q=80&w=200')} alt={p.name} />
                      <div className="cart-item-info">
                        <div className="cart-item-name">{p.name}</div>
                        <div className="cart-item-price">₹{p.salePrice || p.price} {p.qty > 1 && <span style={{ fontSize: 12, color: '#888' }}>× {p.qty}</span>}</div>
                      </div>
                      <button className="cart-item-remove" onClick={() => removeItem(p.indices[p.indices.length - 1])}>✕</button>
                    </div>
                  ))}
                </div>
                <div className="cart-summary">
                  <div className="cart-summary-row"><span>Subtotal ({cart.length} items)</span><span>₹{subtotal}</span></div>
                  <div className="cart-summary-row"><span>Delivery Charge</span><span style={{ color: totalDelivery > 0 ? '#c62828' : '#2e7d32' }}>{totalDelivery > 0 ? '₹' + totalDelivery : 'FREE'}</span></div>
                  <div className="cart-summary-row total"><span>Total</span><span>₹{total}</span></div>
                  <button className="cart-checkout-btn" onClick={onCheckout}>Proceed to Checkout →</button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    /* ─── CHECKOUT PAGE ─── */
    function CheckoutPage({ cart, user, onBack, onSuccess }) {
      const [placing, setPlacing] = useState(false);
      const [userLat, setUserLat] = useState(null);
      const [userLng, setUserLng] = useState(null);
      const [locationStatus, setLocationStatus] = useState('');
      const [addressText, setAddressText] = useState('');
      const [detectingLocation, setDetectingLocation] = useState(false);
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markerRef = useRef(null);

      const subtotal = cart.reduce((s, p) => s + (p.salePrice || p.price), 0);
      const seenProducts = {};
      cart.forEach(p => { const k = p.id || p.name; if (!seenProducts[k]) seenProducts[k] = p; });
      const totalDelivery = Object.values(seenProducts).reduce((s, p) => s + (p.deliveryCharge || 0), 0);
      const total = subtotal + totalDelivery;

      // Initialize Leaflet map
      useEffect(() => {
        if (mapRef.current && !mapInstanceRef.current) {
          const map = L.map(mapRef.current).setView([28.6139, 77.2090], 12);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          mapInstanceRef.current = map;
        }
        return () => { if (mapInstanceRef.current) { mapInstanceRef.current.remove(); mapInstanceRef.current = null; } };
      }, []);

      // Auto-detect location on mount
      useEffect(() => {
        if (!userLat && !userLng) {
          detectLocation();
        }
      }, []);

      // Update map when coordinates change
      useEffect(() => {
        if (userLat && userLng && mapInstanceRef.current) {
          mapInstanceRef.current.setView([userLat, userLng], 15);
          if (markerRef.current) {
            markerRef.current.setLatLng([userLat, userLng]);
          } else {
            markerRef.current = L.marker([userLat, userLng]).addTo(mapInstanceRef.current)
              .bindPopup('📍 Your Delivery Location').openPopup();
          }
        }
      }, [userLat, userLng]);

      const detectLocation = () => {
        setDetectingLocation(true);
        setLocationStatus('📍 Detecting your location...');
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              setUserLat(lat);
              setUserLng(lng);
              setLocationStatus('✅ Location detected!');
              // Reverse geocode using Nominatim
              try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await res.json();
                setAddressText(data.display_name || '');
              } catch (e) {
                setAddressText('');
              }
              setDetectingLocation(false);
            },
            (err) => {
              setLocationStatus('❌ Location access denied. Please enter manually.');
              setDetectingLocation(false);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
          );
        } else {
          setLocationStatus('❌ Geolocation not supported by this browser.');
          setDetectingLocation(false);
        }
      };

      const placeOrder = async () => {
        if (!addressText.trim()) {
          alert('Please detect or enter your delivery address.');
          return;
        }
        setPlacing(true);
        try {
          const itemMap = {};
          cart.forEach(p => {
            const k = p.id || p.name;
            if (itemMap[k]) itemMap[k].qty++;
            else itemMap[k] = { name: p.name, price: p.salePrice || p.price, deliveryCharge: p.deliveryCharge || 0, qty: 1, img: p.imgs ? p.imgs[0] : (p.image || ''), deliveryTime: p.deliveryTime || '30-35 min' };
          });
          const items = Object.values(itemMap);
          let userPhone = 'N/A';
          try {
            const userDoc = await fbDb.collection('users').doc(user.uid).get();

          const now = Date.now();
          const batch = fbDb.batch();
          const items = [];
          snap.forEach(doc => {
            const d = doc.data();
            // Rejected: delete immediately
            if (d.status === 'rejected') {
              batch.delete(doc.ref);
              return;
            }
            // Completed: delete after 1 hour
            if (d.status === 'completed') {
              const completedMs = d.completedAt ? d.completedAt.toMillis() : (d.createdAt ? d.createdAt.toMillis() : 0);
              if (now - completedMs > 3600000) { // 1 hour
                batch.delete(doc.ref);
                return;
              }
            }
            items.push({ id: doc.id, ...d });
          });
          // Sort by createdAt descending client-side
          items.sort((a, b) => {
            const at = a.createdAt ? a.createdAt.toMillis() : 0;
            const bt = b.createdAt ? b.createdAt.toMillis() : 0;
            return bt - at;
          });
          await batch.commit();
          setOrders(items);
          setLoading(false);

        return unsub;

    function AdminOrdersSection() {
      const [orders, setOrders] = useState([]);

      const [screenshotModal, setScreenshotModal] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');

      useEffect(() => {
        const unsub = fbDb.collection('orders')
          .where('status', 'in', ['pending', 'served', 'completed', 'rejected'])
          .onSnapshot(snap => {
            const items = [];
            snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            // Sort by createdAt descending client-side
            items.sort((a, b) => {
              const at = a.createdAt ? a.createdAt.toMillis() : 0;
              const bt = b.createdAt ? b.createdAt.toMillis() : 0;
              return bt - at;
            });
            setOrders(items);
            setLoading(false);
          });
        return unsub;
      }, []);

      const updateStatus = async (id, status) => {
        if (status === 'rejected') {
          await fbDb.collection('orders').doc(id).delete();
        } else if (status === 'completed') {
          await fbDb.collection('orders').doc(id).update({ status, completedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          await fbDb.collection('orders').doc(id).update({ status });
        }
      };

      const autoCleanup = async () => {
        const now = Date.now();
        const cutoff = now - (1 * 60 * 60 * 1000); // 1 hour
        const snap = await fbDb.collection('orders').where('status', 'in', ['completed', 'rejected']).get();
        const batch = fbDb.batch();
        snap.forEach(doc => {
          const d = doc.data();
          const ts = d.completedAt ? d.completedAt.toMillis() : (d.createdAt ? d.createdAt.toMillis() : 0);
          if (ts < cutoff) batch.delete(doc.ref);
        });
        await batch.commit();
      };

      useEffect(() => {
        autoCleanup();
        const interval = setInterval(autoCleanup, 60000); // check every minute
        return () => clearInterval(interval);
      }, []);

      const formatTime = (ts) => {
        if (!ts) return '';
        return new Date(ts.toMillis()).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      };

      const counts = { all: orders.length, pending: orders.filter(o => o.status === 'pending').length, served: orders.filter(o => o.status === 'served').length, completed: orders.filter(o => o.status === 'completed').length };

          setEditName('');

    /* ─── WHATSAPP ORDER ALERT HELPERS ─── */
    // WhatsApp server pe ACCESS_PIN set ho to (localStorage wa_pin — WhatsApp
    // connect page wahin save karta hai) har request me x-pin bhejo
    function waApiHeaders() {
      const h = { 'Content-Type': 'application/json' };
      try {
        const p = localStorage.getItem('wa_pin') || '';
        if (p) h['x-pin'] = p;
      } catch (e) { }
      return h;
    }

    /* ─── WhatsApp session localStorage backup ───
       Connected hone pe server se session blob localStorage me save hota hai.
       Render server restart/redeploy ke baad session wipe ho jata hai (free
       plan pe disk nahi) — tab admin panel khulte hi backup wapas server ko
       bhej diya jata hai → bina QR scan ke automatic reconnect. */
    const WA_BACKUP_KEY = 'wa_session_backup';
    const WA_RESTORE_KEY = 'wa_session_restore';

    function waReadSessionBackup() {
      try { return JSON.parse(localStorage.getItem(WA_BACKUP_KEY) || 'null'); } catch (e) { return null; }
    }

    function waSaveSessionBackup(session, rev) {
      try {
        localStorage.setItem(WA_BACKUP_KEY, JSON.stringify({ session: session, rev: rev, savedAt: Date.now() }));
        localStorage.removeItem(WA_RESTORE_KEY); // naya backup = restore attempts reset
        return true;
      } catch (e) { return false; } // quota full hoga
    }

    // Throttle: 6 ghante me max 3 restore attempts — purana/galat backup ho to
    // infinite QR-import loop nahi banega (backup nayi hoti hi counter reset).
    function waRestoreAttemptAllowed() {
      try {
        const now = Date.now();
        let t = JSON.parse(localStorage.getItem(WA_RESTORE_KEY) || 'null');
        if (!t || now - t.at > 6 * 60 * 60 * 1000) t = { at: now, n: 0 };
        if (t.n >= 3) return false;
        t.n += 1;
        localStorage.setItem(WA_RESTORE_KEY, JSON.stringify(t));
        return true;
      } catch (e) { return true; }
    }

    function waSanitizeText(v) {
      return String(v == null ? '' : v).replace(/[*_~`]/g, '').trim();
    }

    function buildOrderWhatsAppMessage(order) {
      const o = order || {};
      const esc = waSanitizeText;
      const lines = [];
      lines.push('🍽️ *NEW ORDER RECEIVED*');
      lines.push('━━━━━━━━━━━━━━━━━━━━━━');
      lines.push('🆔 *Order ID:* #' + String(o.id || '').slice(-6).toUpperCase());
      lines.push('👤 *Customer:* ' + (esc(o.userName) || 'Guest'));
      lines.push('📞 *Phone:* ' + (esc(o.userPhone) || 'N/A'));
      lines.push('');
      lines.push('🛒 *Items Ordered:*');
      const items = Array.isArray(o.items) ? o.items : [];
      items.forEach((it, i) => {
        const qty = Number(it.qty) || 1;
        const price = Number(it.price) || 0;
        lines.push((i + 1) + '. ' + (esc(it.name) || 'Item') + ' × ' + qty + '  —  ₹' + (price * qty));
      });
      lines.push('');
      lines.push('📦 Subtotal: ₹' + (Number(o.subtotal) || 0));
      lines.push('🚚 Delivery: ' + (Number(o.deliveryCharge) > 0 ? '₹' + Number(o.deliveryCharge) : 'FREE'));
      lines.push('💰 *TOTAL: ₹' + (Number(o.total) || 0) + '*');
      const pm = (!o.paymentMethod || o.paymentMethod === 'cod') ? 'Cash on Delivery' : esc(o.paymentMethod);
      lines.push('💳 *Payment:* ' + pm);
      lines.push('');
      lines.push('📍 *Address:* ' + (esc(o.address) || 'N/A'));
      const hasCoords = !!(Number(o.lat) || Number(o.lng));
      const mapUrl = hasCoords
        ? 'https://www.google.com/maps/search/?api=1&query=' + Number(o.lat) + ',' + Number(o.lng)
        : (o.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(String(o.address)) : '');
      if (mapUrl) lines.push('🗺️ *Google Map:* ' + mapUrl);
      const ts = o.createdAt && typeof o.createdAt.toMillis === 'function' ? o.createdAt.toMillis() : Date.now();
      lines.push('🕐 *Placed at:* ' + new Date(ts).toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }));
      lines.push('📌 *Status:* ' + String(o.status || 'pending').toUpperCase());
      lines.push('━━━━━━━━━━━━━━━━━━━━━━');
      lines.push('_CRISP AND CLOUD — automatic order alert_');
      return lines.join('\n');
    }

    async function sendOrderWhatsAppAlerts(orders) {
      if (!Array.isArray(orders) || !orders.length) return;
      try {
        const cfgSnap = await fbDb.collection('site').doc('whatsapp').get();
        const cfg = cfgSnap.exists ? (cfgSnap.data() || {}) : {};
        const phone = String(cfg.notifyNumber || '').trim();
        if (!phone) return; // number save nahi hai → silent skip
        const base = String(cfg.serverUrl || '').replace(/\/+$/, '');
        for (const order of orders) {
          try {
            // /api/notify: orderId dedup server pe hota hai — admin ke kitne bhi
            // tabs/browsers khule ho, message sirf ek baar jayega
            const res = await fetch(base + '/api/notify', {
              method: 'POST',
              headers: waApiHeaders(),
              body: JSON.stringify({ orderId: order.id, phone, message: buildOrderWhatsAppMessage(order) })
            });
            const data = await res.json().catch(() => ({}));
            if (data.ok) console.log('[WhatsApp] Order alert ' + (data.deduped ? '(already sent)' : 'sent') + ' ->', data.to, 'order:', order.id);
            else console.warn('[WhatsApp] Order alert failed:', data.error || ('HTTP ' + res.status));
          } catch (e) {
            console.warn('[WhatsApp] Order alert error:', e && e.message);
          }
        }
      } catch (e) {
        console.warn('[WhatsApp] notify config error:', e && e.message);
      }
    }

    /* ─── WHATSAPP SECTION (Admin) ─── */
    function WhatsAppNotifierSection() {
      const [savedNumber, setSavedNumber] = useState('');
      const [inputValue, setInputValue] = useState('');
      const [saving, setSaving] = useState(false);
      const [testing, setTesting] = useState(false);
      const [feedback, setFeedback] = useState(null);
      const [waStatus, setWaStatus] = useState(null);

      useEffect(() => {
        const unsub = fbDb.collection('site').doc('whatsapp').onSnapshot(doc => {
          const d = doc.exists ? (doc.data() || {}) : {};
          setSavedNumber(d.notifyNumber || '');
          setInputValue(d.notifyNumber || '');
        });
        return unsub;
      }, []);

      useEffect(() => {
        let alive = true;
        const check = async () => {
          try {
            const r = await fetch('/api/status', { headers: waApiHeaders() });
            if (!alive) return;
            if (r.status === 401) { setWaStatus({ status: 'pin' }); return; }
            const j = await r.json();
            if (alive) setWaStatus(j);
          } catch (e) { if (alive) setWaStatus({ status: 'offline' }); }
        };
        check();
        const t = setInterval(check, 10000);
        return () => { alive = false; clearInterval(t); };
      }, []);

      const normalizeNumber = (raw) => {
        const v = String(raw || '').trim().replace(/[\s\-()]/g, '');
        const digits = v.replace(/\D/g, '');
        if (digits.length < 10 || digits.length > 15) return null;
        if (v.startsWith('+')) return '+' + digits;
        if (digits.length <= 10) return '+91' + digits;
        return '+' + digits;
      };

      const saveNumber = async () => {
        const normalized = normalizeNumber(inputValue);
        if (!normalized) { setFeedback({ kind: 'err', text: '❌ Sahi number daaliye (jaise +919876543210)' }); return; }
        setSaving(true);
        try {
          await fbDb.collection('site').doc('whatsapp').set(
            { notifyNumber: normalized, updatedAt: firebase.firestore.FieldValue.serverTimestamp() },
            { merge: true }
          );
          setFeedback({ kind: 'ok', text: '✅ Number saved: ' + normalized + ' — ab har new order is pe WhatsApp jayega' });
        } catch (e) {

        try {

            body: JSON.stringify({ phone: normalized, message: '✅ Test alert — CRISP AND CLOUD WhatsApp notifications working!' })

            <div style={{ display: 'flex', gap: 8, marginTop: 6, flexWrap: 'wrap' }}>

    /* ─── APP ─── */
    function App() {
      const [page, setPage] = useState('order');
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [showAuth, setShowAuth] = useState(true);
      const [authMode, setAuthMode] = useState('login');
      const [siteContent, setSiteContent] = useState({});
      const [userRole, setUserRole] = useState(null);

      useEffect(() => {
        const unsub = fbAuth.onAuthStateChanged(async u => {
          if (u) {
            try {
              const doc = await fbDb.collection('users').doc(u.uid).get();
              if (doc.exists && doc.data().phone) {
                setUser(u);
                setShowAuth(false);
                if (doc.data().role) setUserRole(doc.data().role);
                else setUserRole(u.email === ADMIN_EMAIL ? 'admin' : 'user');
              } else {
                setUser(null);
                setUserRole(null);
              }
            } catch (e) {
              setUser(u);
              setShowAuth(false);
              setUserRole(u.email === ADMIN_EMAIL ? 'admin' : 'user');
            }
          } else {
            setUser(null);
            setUserRole(null);
          }
          setAuthLoading(false);
        });
        return unsub;
      }, []);

      useEffect(() => {
        const unsub = fbDb.collection('site').doc('content').onSnapshot(doc => {
          if (doc.exists) setSiteContent(doc.data());
        });
        return unsub;
      }, []);

      // 💬 WhatsApp order-alert listener — ROOT level, sirf admin ke liye.
      // Admin logged-in hai aur website khuli hai (menu HO ya admin panel HO),
      // naya order aate hi saved number pe WhatsApp alert chali jayegi.
      // (Server /api/notify pe orderId dedup karta hai — multiple tabs ya
      // panel-dono-page pe ho to bhi message sirf ek baar jayega)
      useEffect(() => {
        if (userRole !== 'admin') return undefined;
        let initialSnapshot = true;
        const knownOrderIds = new Set();
        const unsub = fbDb.collection('orders')
          .where('status', 'in', ['pending', 'served', 'completed', 'rejected'])
          .onSnapshot(snap => {
            if (initialSnapshot) {
              // Purane orders (jo pehle se Firestore me hain) ko skip karo —
              // sirf is session me aaye naye orders ka alert bhejna hai
              snap.forEach(doc => knownOrderIds.add(doc.id));
              initialSnapshot = false;
              return;
            }
            const newOrders = [];
            snap.docChanges().forEach(change => {
              if (change.type === 'added' && !knownOrderIds.has(change.doc.id)) {
                knownOrderIds.add(change.doc.id);
                newOrders.push({ id: change.doc.id, ...change.doc.data() });
              }
            });
            if (newOrders.length) sendOrderWhatsAppAlerts(newOrders);
          }, err => console.warn('[WhatsApp] orders listener error:', err && err.message));
        return unsub;
      }, [userRole]);

      // 💬 WhatsApp session localStorage sync — ROOT level, sirf admin ke liye.
      // 1) Server connected hai → session blob localStorage me save (rev change par).
      // 2) Server ke paas session nahi (Render restart/deploy) aur QR/disconnected
      //    dikh raha hai → admin panel khulte hi backup wapas bhej kar auto-reconnect.
      useEffect(() => {
        if (userRole !== 'admin') return undefined;
        let alive = true;
        let busy = false;
        const check = async () => {
          if (!alive || busy) return;
          busy = true;
          try {
            const r = await fetch('/api/status', { headers: waApiHeaders() });
            if (!alive || r.status === 401) return;
            const j = await r.json().catch(() => null);
            if (!alive || !j || !j.status) return;
            const backup = waReadSessionBackup();
            if (j.sessionPresent && j.status === 'connected') {
              // Server ke paas latest session hai → agar rev badla hai to naya backup lo
              if (!backup || backup.rev !== j.sessionRev) {
                const er = await fetch('/api/session/export', { headers: waApiHeaders() });
                if (!alive) return;
                const d = er.ok ? await er.json().catch(() => null) : null;
                if (d && d.ok && d.session) {
                  const saved = waSaveSessionBackup(d.session, d.rev);
                  if (saved) console.log('[WhatsApp] session backup saved (rev ' + d.rev + ')');
                }
              }
            } else if (!j.sessionPresent && (j.status === 'qr' || j.status === 'disconnected') && backup && backup.session) {
              // Server session kho chuka hai (restart) → localStorage backup wapas bhejo
              if (!waRestoreAttemptAllowed()) return;
              const ir = await fetch('/api/session/import', {
                method: 'POST', headers: waApiHeaders(),
                body: JSON.stringify({ data: backup.session })
              });
              const d = await ir.json().catch(() => null);
              if (!alive) return;
              if (d && d.ok) console.log('[WhatsApp] session restore -> server (saving wali session, bina QR)');
              else console.warn('[WhatsApp] session restore fail:', d && d.error);
            }
          } catch (e) { /* offline — agla tick retry karega */ }
          finally { busy = false; }
        };
        check();
        const t = setInterval(check, 15000);
        return () => { alive = false; clearInterval(t); };
      }, [userRole]);

      const [pageLoading, setPageLoading] = useState(false);

      // PWA: Capture install prompt
      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const goTo = (key) => {
        if (key === page) return;
        setPageLoading(true);
        setTimeout(() => {
          setPage(key);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(() => setPageLoading(false), 300);
        }, 250);
      };

      useEffect(() => {
        const handler = (e) => goTo(e.detail);
        document.addEventListener('navigate', handler);
        return () => document.removeEventListener('navigate', handler);
      }, [page]);

      const handleLoginRequired = () => {
        setAuthMode('guard');
        setShowAuth(true);
      };

      const handleAuthSuccess = (u) => {
        setUser(u);
        setShowAuth(false);
        fbDb.collection('users').doc(u.uid).get().then(doc => {
          if (doc.exists && doc.data().role) setUserRole(doc.data().role);
          else setUserRole(u.email === ADMIN_EMAIL ? 'admin' : 'user');
        }).catch(() => setUserRole(u.email === ADMIN_EMAIL ? 'admin' : 'user'));
      };

      if (authLoading) return null;

      return (
        <React.Fragment>
          <Nav page={page} onNav={goTo} user={user} onLoginClick={() => { setAuthMode('login'); setShowAuth(true); }} userRole={userRole} />
          {pageLoading && (
            <div className="loading-overlay">
              <div className="loading-spinner"></div>
            </div>
          )}
          {page === 'order' && <div className="page-transition"><MenuPage user={user} onLoginRequired={handleLoginRequired} /></div>}
          {page === 'admin' && <div className="page-transition"><AdminPage user={user} userRole={userRole} onClose={() => goTo('order')} /></div>}
          {showAuth && (
            <AuthPopup
              mode={authMode}
              onClose={() => setShowAuth(false)}
              onSuccess={handleAuthSuccess}
            />
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Hide splash loader after 2 seconds
    setTimeout(() => {
      const splash = document.getElementById('splashLoader');
      if (splash) splash.classList.add('hide');
      setTimeout(() => { if (splash) splash.remove(); }, 600);
    }, 2000);
  </script>
</body>

</html>
